# ============================================================
#  Wallapop Theme — Propiedades directas de UIManager
#  Compatible con FlatLaf setGlobalExtraDefaults
# ============================================================

# --- Botones ---
Button.background=#FF6B35
Button.foreground=#FFFFFF
Button.hoverBackground=#E85520
Button.pressedBackground=#C44010
Button.focusedBackground=#E85520
Button.borderColor=#FF6B35
Button.hoverBorderColor=#E85520
Button.focusedBorderColor=#E85520
Button.arc=10
Button.hoverAnimationDuration=150
Button.pressedAnimationDuration=100

# --- Campos de texto ---
TextField.background=#FFFFFF
TextField.foreground=#1A1A2E
TextField.placeholderForeground=#888899
TextField.borderColor=#E8E8EE
TextField.focusedBorderColor=#FF6B35
TextField.hoverBorderColor=#CCCCDD
TextField.arc=8
TextField.focusedBackground=#FFFFFF

PasswordField.background=#FFFFFF
PasswordField.borderColor=#E8E8EE
PasswordField.focusedBorderColor=#FF6B35
PasswordField.arc=8

TextArea.background=#FFFFFF
TextArea.foreground=#1A1A2E
TextArea.caretColor=#FF6B35
TextArea.selectionBackground=#FFF0EB
TextArea.selectionForeground=#1A1A2E
TextArea.borderColor=#E8E8EE
TextArea.focusedBorderColor=#FF6B35

# --- ComboBox ---
ComboBox.background=#FFFFFF
ComboBox.foreground=#1A1A2E
ComboBox.borderColor=#E8E8EE
ComboBox.focusedBorderColor=#FF6B35
ComboBox.hoverBorderColor=#CCCCDD
ComboBox.arc=8
ComboBox.selectionBackground=#FFF0EB
ComboBox.selectionForeground=#1A1A2E
ComboBox.buttonBackground=#FFFFFF

# --- Panel y fondo general ---
Panel.background=#FAFAFA
ScrollPane.background=#FAFAFA
Viewport.background=#FAFAFA

# --- Listas ---
List.background=#FFFFFF
List.foreground=#1A1A2E
List.selectionBackground=#FFF0EB
List.selectionForeground=#1A1A2E
List.hoverBackground=#F5F5FA

# --- Tabla ---
Table.background=#FFFFFF
Table.foreground=#1A1A2E
Table.gridColor=#E8E8EE
Table.selectionBackground=#FFF0EB
Table.selectionForeground=#1A1A2E
Table.hoverBackground=#F5F5FA
Table.rowHeight=42
Table.showHorizontalLines=true
Table.showVerticalLines=false
TableHeader.background=#FAFAFA
TableHeader.foreground=#888899
TableHeader.separatorColor=#E8E8EE

# --- ScrollBar ---
ScrollBar.thumb=#D0D0DE
ScrollBar.thumbHover=#FF6B35
ScrollBar.thumbPressed=#E85520
ScrollBar.track=#F0F0F5
ScrollBar.width=8
ScrollBar.thumbArc=999
ScrollBar.trackArc=999

# --- CheckBox ---
CheckBox.icon.selectedBackground=#FF6B35
CheckBox.icon.selectedBorderColor=#FF6B35
CheckBox.icon.focusedBorderColor=#FF6B35
CheckBox.icon.hoverBorderColor=#E85520
CheckBox.icon.arc=4

# --- RadioButton ---
RadioButton.icon.selectedColor=#FF6B35
RadioButton.icon.focusedBorderColor=#FF6B35

# --- Slider ---
Slider.trackColor=#E8E8EE
Slider.thumbColor=#FF6B35
Slider.focusedColor=#FF6B35
Slider.hoverThumbColor=#E85520

# --- ProgressBar ---
ProgressBar.background=#E8E8EE
ProgressBar.foreground=#FF6B35
ProgressBar.arc=999

# --- TabbedPane ---
TabbedPane.underlineColor=#FF6B35
TabbedPane.inactiveUnderlineColor=#E8E8EE
TabbedPane.selectedBackground=#FFFFFF
TabbedPane.selectedForeground=#FF6B35
TabbedPane.tabHeight=42

# --- MenuBar ---
MenuBar.background=#FFFFFF
MenuBar.borderColor=#E8E8EE
MenuItem.selectionBackground=#FFF0EB
MenuItem.selectionForeground=#1A1A2E
Menu.selectionBackground=#FFF0EB
Menu.selectionForeground=#1A1A2E
PopupMenu.background=#FFFFFF
PopupMenu.borderColor=#E8E8EE

# --- ToolTip ---
ToolTip.background=#1A1A2E
ToolTip.foreground=#FFFFFF

# --- Componentes generales ---
Component.arc=8
Component.focusWidth=2
Component.focusedBorderColor=#FF6B35
Component.focusAnimationDuration=150

# --- Spinner ---
Spinner.background=#FFFFFF
Spinner.borderColor=#E8E8EE
Spinner.focusedBorderColor=#FF6B35
Spinner.arc=8

# --- Separadores ---
Separator.foreground=#E8E8EE
